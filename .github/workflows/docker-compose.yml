name: Docker Image CI

on:
    push:
        branches:
          - "main"
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
        - name: 📥 Checkout repository
          uses: actions/checkout@v3

        - name: 🔑 Log in to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_TOKEN }}
            
        - name: 🛠️ Build and tag Docker images
          run: |
            docker compose -f docker-compose.yml build
            
        - name: 🐳 Tag & push Backend image
          run: |
            docker tag todo101-todo-backend:latest ${{ secrets.DOCKER_USER }}/todo-backend:latest
            docker push ${{ secrets.DOCKER_USER }}/todo-backend:latest

        - name: 🐳 Tag & push Frontend image
          run: |
            docker tag todo101-todo-frontend:latest ${{ secrets.DOCKER_USER }}/todo-frontend:latest
            docker push ${{ secrets.DOCKER_USER }}/todo-frontend:latest
                